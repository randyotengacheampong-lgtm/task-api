<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow by Kofi</title>
<style>
body{max-width:600px;margin:40px auto;padding:20px;background:#0e0e10;color:#fff;font-family:sans-serif}
.card{padding:20px;border-radius:12px;border:1px solid #2a2a2e;background:#1a1a1e}
input{width:70%;padding:12px;border-radius:8px;border:1px solid #333;background:#0e0e10;color:#fff}
button{padding:12px 18px;border-radius:8px;border:none;cursor:pointer;background:#5b5bff;color:#fff;margin-left:8px}
.task{padding:14px;margin:10px 0;border-radius:10px;display:flex;justify-content:space-between;background:#252529}
.done{text-decoration:line-through;opacity:.5}
</style>
</head>
<body>
<h1>TaskFlow ⚡</h1>
<p>FastAPI + Vanilla JS — by Kofi</p>
<div class="card">
<input id="taskInput" placeholder="What needs to be done?" />
<button onclick="addTask()">Add Task</button>
<div id="taskList" style="margin-top:20px"></div>
</div>
<script>
const API_URL = window.location.origin + "/api/tasks";
async function loadTasks(){
  const res = await fetch(API_URL);
  const tasks = await res.json();
  const list = document.getElementById("taskList");
  list.innerHTML = "";
  tasks.forEach(t=>{
    const div = document.createElement("div");
    div.className = "task" + (t.completed ? " done" : "");
    div.innerHTML = `<span onclick="toggleTask(${t.id}, ${t.completed})">${t.title}</span> <button onclick="deleteTask(${t.id})">X</button>`;
    list.appendChild(div);
  });
}
async function addTask(){
  const input = document.getElementById("taskInput");
  if(!input.value) return;
  await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({title:input.value, description:"", completed:false})
  });
  input.value = "";
  loadTasks();
}
async function deleteTask(id){
  await fetch(API_URL + "/" + id, {method:"DELETE"});
  loadTasks();
}
async function toggleTask(id, completed){
  const tasksRes = await fetch(API_URL);
  const tasks = await tasksRes.json();
  const task = tasks.find(x=>x.id===id);
  if(!task) return;
  await fetch(API_URL + "/" + id, {
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({...task, completed:!completed})
  });
  loadTasks();
}
loadTasks();
</script>
</body>
</html>
